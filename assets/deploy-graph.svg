<svg viewBox="0 0 900 280" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,monospace">
  <defs>
    <filter id="glow-sm" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-lg" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="track-ae" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="60%" stop-color="#E879F9" stop-opacity="0.03"/>
      <stop offset="92%" stop-color="#E879F9" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#E879F9" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="track-lo" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="40%" stop-color="#A855F7" stop-opacity="0.03"/>
      <stop offset="80%" stop-color="#A855F7" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="track-cm" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.03"/>
      <stop offset="42%" stop-color="#7C3AED" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="track-mk" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9333EA" stop-opacity="0.03"/>
      <stop offset="90%" stop-color="#9333EA" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0.35"/>
    </linearGradient>
    <radialGradient id="dot-hot" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#F5D0FE"/>
      <stop offset="100%" stop-color="#E879F9"/>
    </radialGradient>
    <radialGradient id="dot-md" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#DDD6FE"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </radialGradient>
    <style>
      @keyframes pulse-ring {
        0%   { r: 16; opacity: 0.7; }
        70%  { r: 30; opacity: 0; }
        100% { r: 30; opacity: 0; }
      }
      @keyframes pulse-ring-sm {
        0%   { r: 10; opacity: 0.6; }
        70%  { r: 20; opacity: 0; }
        100% { r: 20; opacity: 0; }
      }
      @keyframes pulse-ring-mk {
        0%   { r: 9; opacity: 0.5; }
        70%  { r: 18; opacity: 0; }
        100% { r: 18; opacity: 0; }
      }
      @keyframes dot-breathe {
        0%, 100% { opacity: 0.9; }
        50% { opacity: 0.6; }
      }
      @keyframes fade-in-track {
        from { opacity: 0; }
        to   { opacity: 1; }
      }
      .pulse-lg  { animation: pulse-ring    2.4s cubic-bezier(0.4,0,0.6,1) infinite; }
      .pulse-sm  { animation: pulse-ring-sm 2.8s cubic-bezier(0.4,0,0.6,1) infinite 0.3s; }
      .pulse-mk  { animation: pulse-ring-mk 3.2s cubic-bezier(0.4,0,0.6,1) infinite 0.6s; }
      .breathe   { animation: dot-breathe   2s ease-in-out infinite; }
      .track     { animation: fade-in-track 1s ease-out both; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="900" height="280" fill="#0d0618"/>
  <rect width="900" height="280" fill="url(#track-ae)" opacity="0"/>

  <!-- Subtle dot grid -->
  <pattern id="dots" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
    <circle cx="15" cy="15" r="0.8" fill="#2a1545"/>
  </pattern>
  <rect width="900" height="280" fill="url(#dots)" opacity="0.5"/>

  <!-- Month dividers (Jun1=x130, Jul1=x316, Aug1=x508, Sep1=x700) -->
  <line x1="316" y1="42" x2="316" y2="248" stroke="#C084FC" stroke-opacity="0.08" stroke-dasharray="3,7"/>
  <line x1="508" y1="42" x2="508" y2="248" stroke="#C084FC" stroke-opacity="0.08" stroke-dasharray="3,7"/>
  <line x1="700" y1="42" x2="700" y2="248" stroke="#C084FC" stroke-opacity="0.08" stroke-dasharray="3,7"/>
  <!-- TODAY vertical line x=843 -->
  <line x1="843" y1="30" x2="843" y2="252" stroke="#E879F9" stroke-opacity="0.22" stroke-dasharray="2,5"/>

  <!-- Repo track lines -->
  <line x1="130" y1="88"  x2="880" y2="88"  stroke="url(#track-ae)" stroke-width="1.5" class="track"/>
  <line x1="130" y1="145" x2="880" y2="145" stroke="url(#track-lo)" stroke-width="1.5" class="track"/>
  <line x1="130" y1="195" x2="880" y2="195" stroke="url(#track-cm)" stroke-width="1.5" class="track"/>
  <line x1="130" y1="240" x2="880" y2="240" stroke="url(#track-mk)" stroke-width="1.5" class="track"/>

  <!-- Title -->
  <text x="505" y="20" fill="#C084FC" font-size="10" text-anchor="middle" letter-spacing="4" opacity="0.7">DEPLOY TIMELINE</text>
  <text x="843" y="26" fill="#E879F9" font-size="7.5" text-anchor="middle" opacity="0.9" letter-spacing="1.5">HOJE</text>

  <!-- Repo labels -->
  <text x="122" y="91"  fill="#E879F9" font-size="10" text-anchor="end" font-weight="600" letter-spacing="-0.3">agenda-ae</text>
  <text x="122" y="148" fill="#A855F7" font-size="10" text-anchor="end" letter-spacing="-0.3">level-os</text>
  <text x="122" y="198" fill="#7C3AED" font-size="10" text-anchor="end" letter-spacing="-0.3">cycle-motors</text>
  <text x="122" y="243" fill="#9333EA" font-size="10" text-anchor="end" letter-spacing="-0.3">MaxKsp</text>

  <!-- Month labels -->
  <text x="133" y="265" fill="#4B2A6E" font-size="9" letter-spacing="1">JUN</text>
  <text x="316" y="265" fill="#4B2A6E" font-size="9" letter-spacing="1">JUL</text>
  <text x="508" y="265" fill="#4B2A6E" font-size="9" letter-spacing="1">AGO</text>
  <text x="700" y="265" fill="#4B2A6E" font-size="9" letter-spacing="1">SET</text>

  <!-- â”€â”€ cycle-motors-erp: Jun 10(4)x186, Jun 30(5)x310, Jul 6(1)x347 â”€â”€ -->
  <circle cx="186" cy="195" r="8"   fill="#7C3AED" opacity="0.7"/>
  <text   x="186" y="198"           fill="#e2d9f3" font-size="7.5" text-anchor="middle">4</text>
  <line x1="186" y1="195" x2="310" y2="195" stroke="#7C3AED" stroke-opacity="0.2" stroke-width="1"/>
  <circle cx="310" cy="195" r="8.5" fill="#7C3AED" opacity="0.75"/>
  <text   x="310" y="198"           fill="#e2d9f3" font-size="7.5" text-anchor="middle">5</text>
  <line x1="310" y1="195" x2="347" y2="195" stroke="#7C3AED" stroke-opacity="0.2" stroke-width="1"/>
  <circle cx="347" cy="195" r="4.5" fill="#7C3AED" opacity="0.5"/>

  <!-- â”€â”€ level-os: Jul 23-28, Aug 8, Aug 19, Aug 22, Aug 27 â”€â”€ -->
  <!-- cluster Jul 23-28: 3,18,5,2,3 at x=452,458,464,470,483 -->
  <line x1="452" y1="145" x2="669" y2="145" stroke="#A855F7" stroke-opacity="0.18" stroke-width="1"/>
  <circle cx="452" cy="145" r="6"    fill="#A855F7" opacity="0.65"/>
  <circle cx="458" cy="145" r="11.5" fill="url(#dot-md)" opacity="0.9" filter="url(#glow-sm)"/>
  <text   x="458" y="148.5"          fill="#fff" font-size="7.5" text-anchor="middle" font-weight="600">18</text>
  <circle cx="464" cy="145" r="7.5"  fill="#A855F7" opacity="0.72"/>
  <text   x="464" y="148"            fill="#e2d9f3" font-size="7" text-anchor="middle">5</text>
  <circle cx="470" cy="145" r="5.5"  fill="#A855F7" opacity="0.55"/>
  <circle cx="483" cy="145" r="6"    fill="#A855F7" opacity="0.6"/>
  <circle cx="551" cy="145" r="7.5"  fill="#A855F7" opacity="0.7"/>
  <text   x="551" y="148"            fill="#e2d9f3" font-size="7" text-anchor="middle">5</text>
  <circle cx="620" cy="145" r="4.5"  fill="#A855F7" opacity="0.5"/>
  <circle cx="639" cy="145" r="7.5"  fill="#A855F7" opacity="0.7"/>
  <text   x="639" y="148"            fill="#e2d9f3" font-size="7" text-anchor="middle">5</text>
  <circle cx="669" cy="145" r="5.5"  fill="#A855F7" opacity="0.6"/>

  <!-- â”€â”€ MaxKsp: Jul 6(4)x347, Sep 11(3)x763, Sep 15(1)x787, Sep 24(6)x843 â”€â”€ -->
  <line x1="347" y1="240" x2="843" y2="240" stroke="#9333EA" stroke-opacity="0.12" stroke-width="1"/>
  <circle cx="347" cy="240" r="7.5"  fill="#9333EA" opacity="0.65"/>
  <text   x="347" y="243"            fill="#e2d9f3" font-size="7" text-anchor="middle">4</text>
  <circle cx="763" cy="240" r="6"    fill="#9333EA" opacity="0.65"/>
  <circle cx="787" cy="240" r="4.5"  fill="#9333EA" opacity="0.5"/>
  <!-- Sep 24 MaxKsp - recent, pulsing -->
  <circle cx="843" cy="240" r="9" fill="none" stroke="#C084FC" stroke-width="1.5" class="pulse-mk"/>
  <circle cx="843" cy="240" r="8.5"  fill="#C084FC" opacity="0.85" filter="url(#glow-sm)"/>
  <text   x="843" y="243.5"          fill="#fff" font-size="7.5" text-anchor="middle" font-weight="600">6</text>

  <!-- â”€â”€ agenda-ae: Sep 22(1)x830, Sep 23(86)x837, Sep 24(13)x843 â”€â”€ -->
  <line x1="830" y1="88" x2="843" y2="88" stroke="#E879F9" stroke-opacity="0.3" stroke-width="1.5"/>
  <circle cx="830" cy="88" r="4.5"  fill="#E879F9" opacity="0.55"/>
  <!-- Sep 23: 86 commits â€“ THE HIGHLIGHT -->
  <!-- outer glow halo -->
  <circle cx="837" cy="88" r="16" fill="none" stroke="#E879F9" stroke-width="1.5" class="pulse-lg"/>
  <!-- glow blur layer -->
  <circle cx="837" cy="88" r="16" fill="#E879F9" opacity="0.12" filter="url(#glow-lg)"/>
  <!-- solid dot -->
  <circle cx="837" cy="88" r="16"  fill="url(#dot-hot)" opacity="0.95" filter="url(#glow-sm)" class="breathe"/>
  <text   x="837" y="91.5"          fill="#fff" font-size="9" text-anchor="middle" font-weight="700">86</text>
  <!-- Sep 24: 13 commits -->
  <circle cx="843" cy="88" r="10" fill="none" stroke="#E879F9" stroke-width="1.5" class="pulse-sm"/>
  <circle cx="843" cy="88" r="10"  fill="url(#dot-hot)" opacity="0.88" filter="url(#glow-sm)" class="breathe"/>
  <text   x="843" y="91.5"          fill="#fff" font-size="8" text-anchor="middle" font-weight="600">13</text>

  <!-- LIVE badge -->
  <rect x="856" y="80" width="32" height="14" rx="7" fill="#E879F9" opacity="0.15"/>
  <circle cx="861" cy="87" r="2.5" fill="#E879F9" opacity="0.9">
    <animate attributeName="opacity" values="0.9;0.2;0.9" dur="1.4s" repeatCount="indefinite"/>
  </circle>
  <text x="873" y="90.5" fill="#E879F9" font-size="7.5" font-weight="700" letter-spacing="0.5">LIVE</text>

  <!-- Legend -->
  <text x="133" y="278" fill="#2a1545" font-size="8" letter-spacing="0.5">â— tamanho = commits Â· traÃ§o = perÃ­odo ativo</text>
</svg>
